<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Aperçu des PDF (pdftoppm, bloc CV) : aucune police système (image
     distroless) ; une police NON embarquée dans le PDF est remplacée par
     les polices libres du dépôt (ce dossier, sous-dossiers compris), jamais
     cherchée ailleurs : linéales → Figtree, à empattements → Young Serif,
     chasse fixe → Spline Sans Mono. Cache dans /tmp (disque en lecture seule). -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/fontconfig</cachedir>
  <match target="pattern">
    <test name="family" compare="contains" ignore-blanks="true"><string>Times</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Young Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains" ignore-blanks="true"><string>Courier</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Spline Sans Mono</string></edit>
  </match>
  <alias binding="strong"><family>serif</family><prefer><family>Young Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Spline Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Figtree</family></prefer></alias>
  <!-- Toute autre police absente (Helvetica, Arial, Calibri…) : Figtree. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak"><string>Figtree</string></edit>
  </match>
</fontconfig>
