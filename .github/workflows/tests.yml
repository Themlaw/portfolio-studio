# Intégration continue (lot 103) : dépôt PUBLIC, runners standard gratuits.
#
#  plan     liste des suites e2e (source unique : scripts/test-all-local.sh) répartie en shards
#  checks   tsc, eslint, tokens, contraste, thèmes, npm test
#  hygiene  audit « rien de privé dans le dépôt ni son historique » (scripts/audit-public.mjs)
#  build    build de production (standalone), partagé avec les shards sous forme d'artefact
#  e2e      matrice de shards : chaque shard lance scripts/test-all-local.sh <suites> en mode
#           « start » sur le build partagé (navigateurs Playwright chromium, firefox au besoin)
#  ci       verdict unique (à exiger dans la protection de branche)
#
# Aucun secret n'est nécessaire : tout tourne sur des données synthétiques, serveur et base neufs
# par suite. L'image Docker n'est PAS construite ici (voir docker.yml).
# Lancement manuel d'UNE suite (ou de quelques-unes) :
#   gh workflow run tests.yml --ref <branche> -f suites=kit53
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      suites:
        description: "Suites à lancer seules, séparées par des espaces (ex. « kit53 cadres74 »). Vide = tout. Identifiants : liste E2E de scripts/test-all-local.sh, plus auth, domaine88 et pdf."
        required: false
        default: ""

# Jamais de droit d'écriture : un job n'en reçoit que s'il le déclare lui-même.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  NODE_VERSION: "24"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      manual: ${{ steps.manual.outputs.manual }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: manual
        env:
          SUITES: ${{ github.event.inputs.suites }}
        run: echo "manual=$([ -n "$SUITES" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          SUITES: ${{ github.event.inputs.suites }}
        run: node .github/scripts/ci-plan.mjs --print

  # Contrôles légers (sans navigateur ni serveur).
  checks:
    needs: plan
    if: needs.plan.outputs.manual != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: tsc
        run: npx tsc --noEmit
      - name: lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: check:tokens
        if: ${{ !cancelled() }}
        run: npm run check:tokens
      - name: check:contrast
        if: ${{ !cancelled() }}
        run: npm run check:contrast
      - name: theme:check
        if: ${{ !cancelled() }}
        run: npm run theme:check
      - name: npm test
        if: ${{ !cancelled() }}
        run: npm test
      - name: test-highlight-layout
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/test-highlight-layout.mjs

  # Rien de privé dans l'arbre ni dans TOUT l'historique (secrets, fichiers interdits, IP, e-mails…).
  # Bloquant seulement quand la variable de dépôt AUDIT_ENFORCE vaut « true » (à poser à la bascule en public).
  hygiene:
    needs: plan
    if: needs.plan.outputs.manual != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ vars.AUDIT_ENFORCE != 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --quiet --tags origin 'refs/heads/*:refs/remotes/origin/*' || true
      - name: audit-public (--strict)
        run: node scripts/audit-public.mjs --strict --allow scripts/audit-public.allow

  # Build de production (standalone) : consommé par tous les shards.
  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-build-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - run: node scripts/check-standalone.mjs --require
      - name: Archive du build
        run: tar -cf "$RUNNER_TEMP/next-build.tar" --exclude=.next/cache --exclude=.next/dev .next
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-build
          path: ${{ runner.temp }}/next-build.tar
          retention-days: 1
          compression-level: 1

  # Un shard = une machine, des suites l'une après l'autre (scripts/test-all-local.sh).
  e2e:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: e2e (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Paquets système (ffmpeg, poppler, strace)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg poppler-utils strace file
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: next-build
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/next-build.tar"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.shard.firefox && 'chromium-firefox' || 'chromium' }}-${{ hashFiles('package-lock.json') }}
      - name: Navigateurs Playwright
        env:
          FIREFOX: ${{ matrix.shard.firefox }}
        run: |
          npx playwright install --with-deps --only-shell chromium
          if [ "$FIREFOX" = true ]; then npx playwright install --with-deps firefox; fi
      - name: Suites (${{ matrix.shard.ids }})
        env:
          IDS: ${{ matrix.shard.ids }}
          LOCK: ""                       # pas de verrou : une machine par shard
          BATT_SERVER: start
          BATT_REUSE_BUILD: "1"          # le build vient de l'artefact
          BATT_JOBS: "1"
          PORT: "3121"
          BATTERY_DIR: ${{ runner.temp }}/battery
          BATT_PREFIX: ${{ runner.temp }}/pf-batt
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          bash scripts/test-all-local.sh $IDS 2>&1 | tee "$RUNNER_TEMP/recap.txt"
      - name: Résumé
        if: always()
        run: |
          {
            echo "### ${{ matrix.shard.name }} : ${{ matrix.shard.ids }}"
            echo '```'
            sed -n '/##### Récapitulatif/,$p' "$RUNNER_TEMP/recap.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Journaux et captures de l'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: echec-${{ matrix.shard.name }}
          path: |
            ${{ runner.temp }}/battery
            ${{ runner.temp }}/pf-batt-*/logs
            ${{ runner.temp }}/pf-batt-*/shots
            ${{ runner.temp }}/recap.txt
            screenshots
          retention-days: 7
          if-no-files-found: ignore

  # Verdict unique.
  ci:
    needs: [plan, checks, hygiene, build, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          MANUAL: ${{ needs.plan.outputs.manual }}
        run: |
          echo "résultats : $RESULTS"
          # Manuel : checks et hygiene sont volontairement ignorés (« skipped »).
          for r in $RESULTS; do
            case "$r" in success) ;; skipped) [ "$MANUAL" = true ] || { echo "un job a été ignoré"; exit 1; } ;; *) echo "échec : $r"; exit 1 ;; esac
          done
