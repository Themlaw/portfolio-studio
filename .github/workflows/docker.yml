# Construit l'image de prod et la pousse sur GHCR (privé).
# Komodo (hote-prod) la tire ensuite : ghcr.io/themlaw/portfolio.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*", "da/*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/themlaw/portfolio   # minuscules obligatoires sur GHCR

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts : comme dans le Dockerfile (better-sqlite3 précompilé).
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run lint
      # Garde-fous du moteur de thèmes : aucune couleur en dur hors
      # src/themes/, et contraste AA de chaque preset.
      - run: npm run check:tokens
      - run: npm run check:contrast
      - run: npm test

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest sur main ; sha-<court> partout ; nom du tag git
          # (les « / » sont remplacés par « - » : da/pro → da-pro).
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Le runner GitHub a 16 Go : plafond du tas plus large qu'en local.
          build-args: |
            NODE_MAX_OLD_SPACE=4096
          cache-from: type=gha
          cache-to: type=gha,mode=max
