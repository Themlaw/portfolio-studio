# Image de production : construction MANUELLE seulement (lot 103).
#
# Pourquoi : l'image de production est construite sur la VM de build, pas sur GitHub.
# Ce workflow ne se lance donc plus sur push ni sur tag. Lancé à la main, il construit l'image
# et vérifie son contexte ; il ne la POUSSE sur GHCR que si on coche « publier ».
#
#   gh workflow run docker.yml --ref <branche-ou-tag>              # construit seulement (test)
#   gh workflow run docker.yml --ref <tag> -f publier=true         # construit et pousse sur GHCR
#
# Le dépôt est public ; un paquet GHCR garde sa propre visibilité (réglage du paquet sur GitHub).
name: docker

on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Pousser l'image sur GHCR (sinon : construction seule, rien n'est publié)"
        type: boolean
        required: false
        default: false

# Moindre privilège : le job `check` exécute le code des dépendances (npm test,
# npm run build) ; il ne reçoit que la lecture. Seul `image` peut pousser sur GHCR.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts : comme dans le Dockerfile (better-sqlite3 précompilé).
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run lint
      # Garde-fous du moteur de thèmes : aucune couleur en dur hors src/themes/, contraste AA.
      - run: npm run check:tokens
      - run: npm run check:contrast
      - run: npm test
      # Contexte Docker : chaque fichier dont `npm run build` a besoin n'est pas exclu par .dockerignore.
      - run: node scripts/check-docker-context.mjs
      # Le standalone (ce qui part dans l'image) ne contient ni sources, ni données, ni configuration.
      - run: npm run build
      - run: node scripts/check-standalone.mjs --require

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write          # seul ce job peut écrire un paquet
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: ${{ inputs.publier }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # latest seulement sur la branche par défaut ; sha-<court> partout ; nom du tag git
          # (les « / » deviennent « - » : da/pro → da-pro).
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      # Couches reproductibles : à contenu égal, même digest d'un build à l'autre.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,push=${{ inputs.publier }},rewrite-timestamp=true
          provenance: mode=min
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_MAX_OLD_SPACE=4096
          # mode=min : seules les couches de l'image finale vont dans le cache GitHub Actions. mode=max y exporterait
          # aussi les étapes intermédiaires, dont la couche du `COPY . .` du stage builder (tout le contexte : sources,
          # seed…). Prix : les étapes intermédiaires (npm ci, next build) se refont quand le cache d'image ne suffit pas.
          cache-from: type=gha
          cache-to: type=gha,mode=min
