# Construit l'image de prod et la pousse sur GHCR (privé).
# Komodo (hote-de-prod) la tire ensuite : ghcr.io/themlaw/portfolio.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*", "da/*"]
  workflow_dispatch:

# Moindre privilège : le job `check` exécute le code des dépendances (npm test,
# npm run build) ; il ne reçoit que la lecture. Seul `image` peut pousser sur GHCR.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/themlaw/portfolio   # minuscules obligatoires sur GHCR

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts : comme dans le Dockerfile (better-sqlite3 précompilé).
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run lint
      # Garde-fous du moteur de thèmes : aucune couleur en dur hors
      # src/themes/, et contraste AA de chaque preset.
      - run: npm run check:tokens
      - run: npm run check:contrast
      - run: npm test
      # Contexte Docker : chaque fichier dont `npm run build` a besoin n'est
      # pas exclu par .dockerignore (v0.9.0 : build de l'image cassé alors
      # que le build hors Docker passait).
      - run: node scripts/check-docker-context.mjs
      # Le standalone (ce qui part dans l'image) ne doit contenir ni sources, ni
      # données, ni configuration : build puis contrôle.
      - run: npm run build
      - run: node scripts/check-standalone.mjs --require

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # latest sur main ; sha-<court> partout ; nom du tag git
          # (les « / » sont remplacés par « - » : da/pro → da-pro).
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      # Couches reproductibles : à contenu égal, même digest d'un build à
      # l'autre (COPY --link + dates ramenées à SOURCE_DATE_EPOCH). Un
      # changement de code ne fait re-tirer que .next/static et le code
      # serveur (~4 Mo sur ~170 Mo), même après une perte du cache gha.
      # SOURCE_DATE_EPOCH est une constante, pas la date du commit : sinon les
      # fichiers créés au build (dossiers, enregistrements dpkg) changeraient
      # de date, donc de digest, à chaque commit.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          platforms: linux/amd64
          # Pousse (push=true) avec réécriture des dates dans les couches ; les
          # noms viennent de « tags ». Remplace « push: true ».
          outputs: type=image,push=true,rewrite-timestamp=true
          # Attestation de provenance minimale (n'entre pas dans les couches).
          provenance: mode=min
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Le runner GitHub a 16 Go : plafond du tas plus large qu'en local.
          build-args: |
            NODE_MAX_OLD_SPACE=4096
          cache-from: type=gha
          cache-to: type=gha,mode=max
