<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img">
  <defs>
    <linearGradient id="sky-portrait" x1="0" y1="0" x2="0.21" y2="1">
      <stop offset="0%" stop-color="#F1F0E4"/>
      <stop offset="52%" stop-color="#D8DCC3"/>
      <stop offset="100%" stop-color="#B4C0A1"/>
    </linearGradient>
    <linearGradient id="mid-portrait" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84957A"/>
      <stop offset="100%" stop-color="#5B6D55"/>
    </linearGradient>
    <radialGradient id="glow-portrait" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F8EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8F8EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-portrait" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="31.5"/>
    </filter>
    <filter id="grain-portrait" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="ng"/>
      <feComponentTransfer in="ng" result="nt"><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="nt" mode="multiply"/>
    </filter>
